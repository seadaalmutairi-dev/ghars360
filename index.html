<style>
/*
VOICE: رسمي راقٍ ودافئ؛ منصة تربوية سعودية لا طفولية.
IDEA: مدينة تنمو حول شجرة؛ كل ممارسة حقيقية تضيء بوابة وتزهر غصنًا.
PICTURE: مدينة غَرْس الليلية بالأخضر والذهبي، وشجرة الأثر الشخصية في صفحات القراءة العاجية.
COLOUR and TYPE: زمردي داكن وذهبي هادئ وعاجي؛ Cairo للعناوين وIBM Plex Sans Arabic للنص وTajawal بديلًا.
LAYOUT: الجوال أولًا؛ شريط سفلي للطالبة، وألسنة للبوابات، وبطاقات مؤشرات تعرض المعادلة والمصدر.
*/
:root{color-scheme:light;
--e9:#073B2D;--e5:#16805D;--e10:#06251D;--g:#C9A85C;--gl:#E8CD87;--iv:#F8F6EF;--mint:#DCEDE2;--ink:#24332E;
--bg:#F8F6EF;--card:#ffffff;--line:#e2ddcc;--mut:#5c6b65;--soft:#eef5f0;--soil:#e7dcc3;--teal:#1f8a84;--bad:#a2392f;--warn:#9a6b10;
--r:16px;--sh:0 1px 2px #06251d14,0 8px 24px -12px #06251d33;--fs:17px}
:root[data-theme=dark]{color-scheme:dark;--bg:#071d17;--card:#0c2a21;--line:#1d4437;--ink:#ecf3ef;--mut:#a9bdb4;--soft:#0f3328;--soil:#16392d;--iv:#0c2a21;--mint:#123d30}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#071d17;--card:#0c2a21;--line:#1d4437;--ink:#ecf3ef;--mut:#a9bdb4;--soft:#0f3328;--soil:#16392d;--iv:#0c2a21;--mint:#123d30}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{font-size:var(--fs);scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;font-size:1rem;line-height:1.75;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:'Cairo','IBM Plex Sans Arabic','Tajawal',sans-serif;line-height:1.3;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(1.75rem,4.6vw,2.7rem);font-weight:800}h2{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:700}h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .8em}a{color:var(--e5)}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;vertical-align:-4px}
.muted{color:var(--mut)}.small{font-size:.88rem}.tiny{font-size:.8rem}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
.band{padding-block:clamp(20px,3.5vw,44px)}
/* شريط علوي */
.top{position:sticky;top:0;z-index:40;background:var(--e10);color:#F8F6EF;border-bottom:1px solid #C9A85C55}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;margin-inline-end:auto}
.brand b{font-family:Cairo,sans-serif;font-size:1.2rem;color:var(--gl);line-height:1.1}.brand small{display:block;font-size:.78rem;color:#DCEDE2;line-height:1.3}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid #C9A85C66;background:#ffffff10;color:#F8F6EF;cursor:pointer}
.tbtn:hover{background:#ffffff1c}
.rolesel{width:auto;max-width:170px;min-height:44px;border-radius:12px;border:1px solid var(--g);background:#0b3d2e;color:#F8F6EF;padding:0 10px;font-size:.95rem}
.demo{background:#fff4d6;color:#5a4205;font-size:.85rem;text-align:center;padding:5px 10px;border-bottom:1px solid #e7d29a}
:root[data-theme=dark] .demo{background:#3a2f0f;color:#f6e3ad;border-color:#5b4a1b}
/* تنقل البوابات */
.nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:30}
.nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.nav a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem}
.nav a.on{background:var(--e9);color:#F8F6EF}.nav a:hover:not(.on){background:var(--soft)}
.bnav{position:fixed;inset:auto 0 0 0;z-index:45;background:var(--e10);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #C9A85C66}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;color:#DCEDE2;text-decoration:none;font-size:.78rem;min-height:60px}
.bnav a.on{color:var(--gl)}.bnav a.on .ic{filter:drop-shadow(0 0 6px #E8CD87aa)}
@media(min-width:900px){.bnav{display:none}body{padding-bottom:0}}
/* بطاقات وأزرار */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.4vw,22px);box-shadow:var(--sh)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-inline-start:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--e9);background:var(--e9);color:#F8F6EF;font-weight:600;cursor:pointer;text-decoration:none;font-size:1rem}
.btn:hover{background:var(--e5);border-color:var(--e5)}
.btn.gold{background:linear-gradient(180deg,#E8CD87,#C9A85C);border-color:#b8933f;color:#06251D}
.btn.ghost{background:transparent;color:var(--e9);border-color:var(--line)}:root[data-theme=dark] .btn.ghost{color:var(--gl)}
.btn.ghost:hover{background:var(--soft)}.btn.sm{min-height:40px;padding:0 12px;font-size:.92rem}.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--g);outline-offset:2px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:.86rem;white-space:nowrap}
.chip.ok{background:#e3f3ea;color:#0d5a3f;border-color:#b8dcc8}.chip.wait{background:#fff4d6;color:#6b4c07;border-color:#ecd79c}.chip.need{background:#f8e3df;color:#7d2a21;border-color:#e8bdb5}
:root[data-theme=dark] .chip.ok{background:#12402f;color:#bfeed7}:root[data-theme=dark] .chip.wait{background:#3a2f0f;color:#f6e3ad}:root[data-theme=dark] .chip.need{background:#401a16;color:#f3c4bb}
label.f{display:grid;gap:4px;font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=url],input:not([type]),select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px;font-size:1rem}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--e5);outline:none;box-shadow:0 0 0 3px #16805d33}
.sec{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sec h2{margin:0}
.kick{color:var(--g);font-weight:700;font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{background:var(--soft);font-weight:600}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
/* البطل */
.hero{background:radial-gradient(120% 90% at 50% 0%,#0b3d2e 0%,#06251D 70%);color:#F8F6EF;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:22px 10px}
.hero h1{color:#F8F6EF}.hero h1 em{font-style:normal;color:var(--gl)}
.hero .lead{color:#DCEDE2;max-width:60ch}
.cityWrap{position:relative;border-radius:22px;overflow:hidden;border:1px solid #C9A85C55;background:#03140f}
.city{display:block;width:100%;height:auto}
.city .gate{cursor:pointer;transition:transform .35s}.city .gate:hover .halo,.city .gate:focus .halo{opacity:.45}
.city .gate.off{opacity:.45}.city .gn{fill:#E8CD87;font:700 22px Cairo,sans-serif}.city .gv{fill:#DCEDE2;font:500 16px 'IBM Plex Sans Arabic',sans-serif}
.city .tw{animation:tw 4s infinite ease-in-out}@keyframes tw{50%{opacity:.1}}
.city .pulse{animation:pl 2.6s infinite}@keyframes pl{50%{opacity:.35}}
.gate.lit .halo{animation:pl 3s infinite}
.city3d{perspective:1100px;height:340px;position:relative;overflow:hidden;background:radial-gradient(70% 60% at 50% 60%,#0b3d2e,#03140f)}
.ring{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.g3d{position:absolute;left:50%;top:50%;width:150px;height:190px;margin:-95px 0 0 -75px;border-radius:80px 80px 14px 14px;border:2px solid var(--g);background:linear-gradient(180deg,var(--c),#06251D);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;backface-visibility:hidden;padding:10px}
.g3d b{font-family:Cairo;color:var(--gl);font-size:1.05rem;line-height:1.2}
.stat{display:grid;gap:2px}.stat b{font-family:Cairo;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.1;color:var(--e9);font-variant-numeric:tabular-nums}:root[data-theme=dark] .stat b{color:var(--gl)}
.stat span{color:var(--mut);font-size:.9rem}
.kpi{position:relative;overflow:hidden}.kpi .v{font-family:Cairo;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;color:var(--e9);line-height:1.1}:root[data-theme=dark] .kpi .v{color:var(--gl)}
.kpi .v.na{font-size:1.05rem;color:var(--warn);font-family:inherit;font-weight:600}
.kpi details{font-size:.86rem;color:var(--mut);margin-top:6px}.kpi summary{cursor:pointer;color:var(--e5);min-height:32px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;border-radius:99px;background:var(--e5);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar.gold i{background:linear-gradient(90deg,#C9A85C,#E8CD87)}.bar.teal i{background:var(--teal)}
.barrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:.92rem;margin:6px 0}.barrow .n{text-align:end}
/* العوالم والمراحل */
.whead{color:#F8F6EF;background:linear-gradient(135deg,var(--wc),#06251D 75%);border-radius:0 0 26px 26px}
.whead .wrap{padding-block:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.wicon{width:84px;height:84px;border-radius:50% 50% 18px 18px;border:2px solid var(--gl);display:grid;place-items:center;background:#ffffff14;color:#fff}
.steps{display:flex;gap:6px;overflow-x:auto;padding:12px 2px;scrollbar-width:thin}
.step{flex:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 12px 4px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:.9rem}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-style:normal;font-weight:700;font-size:.85rem}
.step.done i{background:var(--e5);color:#fff}.step.cur{border-color:var(--g);box-shadow:0 0 0 3px #C9A85C33}

.res{border-inline-start:5px solid var(--g);background:var(--soft);padding:12px 16px;border-radius:12px;margin:10px 0}
.res.g2{border-color:var(--e5)}.res.g0{border-color:#c9773a}
.scene{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:#fff}
.storyTxt{font-size:1.12rem;line-height:1.95;background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line);margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:10px;height:10px;border-radius:9px;background:var(--line)}.dots i.on{width:26px;background:var(--e5)}
.tree{display:block;width:100%;height:auto;max-height:70vh}.tree .tl{font:700 15px 'IBM Plex Sans Arabic',sans-serif;fill:var(--ink)}

.fps{display:flex;gap:10px;flex-wrap:wrap}.fpbox{display:grid;justify-items:center;gap:4px;text-align:center;font-size:.82rem;width:96px}

.idcard{display:block;width:100%;height:auto;border-radius:20px;box-shadow:var(--sh)}
.qr{background:#fff;border-radius:8px;display:block}

.dlg{background:var(--bg);color:var(--ink);border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px #000a;border:1px solid var(--g)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.dlg header h3{margin:0;flex:1}.dlg .body{padding:16px 18px 20px}
.toast{position:fixed;inset-inline:0;bottom:calc(90px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:92vw;z-index:99;background:var(--e10);color:#F8F6EF;border:1px solid var(--g);padding:10px 18px;border-radius:14px;box-shadow:var(--sh);animation:up .3s}
@keyframes up{from{transform:translateY(20px);opacity:0}}

.confetti i{position:fixed;top:-10px;width:9px;height:14px;z-index:90;animation:fall 2.4s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.intro{position:fixed;inset:0;z-index:100;background:#03140f;color:#F8F6EF;display:grid;place-items:center;overflow:hidden}

.intro .skip{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-start:14px}
.intro .snd{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px}
.intro .cap{position:absolute;bottom:12vh;left:0;right:0;text-align:center;padding:0 20px}
.intro .l1,.intro .l2,.intro .go{opacity:0;animation:fin 1s forwards}
.intro .l1{animation-delay:3.6s;font-size:clamp(1.05rem,3vw,1.5rem);color:#DCEDE2}

@keyframes fin{to{opacity:1}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:dr 1.6s forwards}@keyframes dr{to{stroke-dashoffset:0}}

/* شجرة الأثر: levels = مصفوفة 9 مستويات (0..6) */
function treeSVG(levels, opts = {}) {
  const W = 760, H = 540, bx = 380, by = 450;
  const anyRoot = levels.some(l => l >= 2), maxL = Math.max(...levels);
  let s = `<svg class="tree" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'شجرة الأثر')}">
  <defs><radialGradient id="tglow" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#E8CD87" stop-opacity=".45"/><stop offset="1" stop-color="#E8CD87" stop-opacity="0"/></radialGradient>
  <linearGradient id="trunk" x1="0" x2="1"><stop offset="0" stop-color="#5a3f22"/><stop offset=".5" stop-color="#7b5a33"/><stop offset="1" stop-color="#4a3219"/></linearGradient></defs>
  <ellipse cx="${bx}" cy="${by + 8}" rx="250" ry="34" fill="var(--soil)"/>
  <circle cx="${bx}" cy="${by - 150}" r="230" fill="url(#tglow)" opacity="${.3 + maxL * .1}"/>`;
  if (anyRoot) for (let i = 0; i < 7; i++) { const dx = (i - 3) * 34; s += `<path d="M${bx} ${by} q${dx * .4} 26 ${dx} ${40 + (i % 2) * 14}" stroke="#C9A85C" stroke-width="${3 - Math.abs(i - 3) * .4}" fill="none" stroke-linecap="round" opacity=".8"/>`; }
  const trunkH = maxL >= 3 ? 190 : maxL >= 1 ? 120 : 40, tw = maxL >= 3 ? 26 : 14;
  if (maxL >= 1) s += `<path d="M${bx - tw} ${by} C${bx - tw * .6} ${by - trunkH * .5} ${bx - 8} ${by - trunkH * .8} ${bx - 6} ${by - trunkH} L${bx + 6} ${by - trunkH} C${bx + 8} ${by - trunkH * .8} ${bx + tw * .6} ${by - trunkH * .5} ${bx + tw} ${by}Z" fill="url(#trunk)"/>`;
  s += `<g class="seed"><circle cx="${bx}" cy="${by - 4}" r="12" fill="#E8CD87" opacity=".5"/><ellipse cx="${bx}" cy="${by - 4}" rx="6" ry="8" fill="#C9A85C"/></g>`;
  const top = by - trunkH;
  levels.forEach((L, i) => {
    const v = VALUES[i], a = (-168 + i * 19.5) * Math.PI / 180, len = 120 + (i % 2) * 26 + (i === 4 ? 30 : 0);
    const ex = bx + Math.cos(a) * len * 1.6, ey = top + Math.sin(a) * len * .8 + 6, mx = bx + Math.cos(a) * len * .45, my = top + Math.sin(a) * len * .3;
    const sx = bx, sy = top + 24;
    const on = L >= 2;
    s += `<g class="br${opts.click ? ' click' : ''}" ${opts.click ? `data-act="branch" data-v="${v.id}" tabindex="0" role="button" aria-label="غصن ${v.n}: ${GROW[L]}"` : ''}>`;
    s += `<path d="M${sx} ${sy} Q${mx} ${my} ${ex} ${ey}" stroke="${on ? '#6b4a26' : '#9aa79f'}" stroke-width="${on ? 4 + L : 2}" fill="none" stroke-linecap="round" stroke-dasharray="${L === 0 ? '4 6' : '0'}" opacity="${L === 0 ? .5 : 1}"/>`;
    if (L >= 1 && L < 4) s += `<circle cx="${ex}" cy="${ey}" r="${L === 1 ? 5 : 7}" fill="${v.c}" opacity=".85"/>`;
    if (L >= 4) for (let k = 0; k < 6; k++) { const la = a + (k - 2.5) * .42, lx = ex + Math.cos(la) * 22, ly = ey + Math.sin(la) * 18; s += `<ellipse cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" rx="13" ry="7" transform="rotate(${(la * 57.3).toFixed(0)} ${lx.toFixed(1)} ${ly.toFixed(1)})" fill="${k % 2 ? '#16805D' : '#2fa275'}"/>`; }
    if (L >= 5) for (let k = 0; k < 3; k++) { const fx = ex + (k - 1) * 14, fy = ey - 16 + (k % 2) * 8; s += `<circle cx="${fx}" cy="${fy}" r="5" fill="#fff"/><circle cx="${fx}" cy="${fy}" r="2.2" fill="${v.c}"/>`; }
    if (L >= 6) s += `<circle class="fruit" cx="${ex}" cy="${ey + 14}" r="10" fill="#E8CD87" stroke="#C9A85C" stroke-width="2"/><circle cx="${ex - 3}" cy="${ey + 11}" r="3" fill="#fff8" />`;
    const lx = ex + Math.cos(a) * 40, ly = ey + Math.sin(a) * 30 - 8 - (i % 2) * 18;
    s += `<text x="${lx.toFixed(0)}" y="${ly.toFixed(0)}" text-anchor="middle" class="tl">${v.n}</text></g>`;
  });
  return s + '</svg>';
}

  const p = P(S.me, vid); if (!p) return 0; const i = p.st.findIndex(x => !x); return i < 0 ? 8 : i;
}

  return `<section class="whead" style="--wc:${v.c}"><div class="wrap">
   <div class="wicon">${ic(v.ic, 44)}</div>
   <div><div class="kick" style="color:var(--gl)">العالم ${AR(VALUES.indexOf(v) + 1)} · ${v.design}</div><h1 style="color:#fff;margin:0">${v.w}</h1><div style="color:#DCEDE2">قيمة ${v.n} · أنجزتِ ${AR(doneCount(p))} من ٩ مراحل</div></div>
  </div></section>
  <div class="wrap">
   ${act ? '' : '<div class="notice" style="margin-top:12px">هذا العالم لم تفعّله المعلمة بعد؛ يمكنك الاطلاع عليه، وتُحتسب مشاركتك عند تفعيله.</div>'}
   <nav class="steps" aria-label="مراحل العالم">${STAGES9.map((s, i) => `<button class="step${p.st[i] ? ' done' : ''}${i === cs ? ' cur' : ''}" data-act="stage" data-v="${vid}" data-i="${i}" aria-current="${i === cs ? 'step' : 'false'}"><i>${p.st[i] ? '✓' : AR(i + 1)}</i>${s.n}</button>`).join('')}</nav>
   <div class="card" id="stagebox"><div class="kick">المرحلة ${AR(cs + 1)} · ${CYCLE[cs]}</div><h2>${STAGES9[cs].n}</h2><p class="muted">${STAGES9[cs].d}</p>${stageBody(v, p, cs)}</div>
   <div class="row" style="margin:14px 0 30px"><button class="btn ghost" data-act="stage" data-v="${vid}" data-i="${Math.max(0, cs - 1)}" ${cs ? '' : 'disabled'}>${ic('right')} السابقة</button><span class="sp"></span><button class="btn ghost" data-act="stage" data-v="${vid}" data-i="${Math.min(8, cs + 1)}" ${cs < 8 ? '' : 'disabled'}>التالية ${ic('left')}</button></div>
  </div>`;
}
function likertHTML(key, items, na = false) {
  const a = UI.ans[key] || [];
  return items.map((it, i) => `<div><b>${AR(i + 1)}. ${it}</b><div class="likert${na ? ' na' : ''}" role="radiogroup" aria-label="${esc(it)}">${SCALE.map((s, x) => `<button type="button" class="${a[i] === x + 1 ? 'on' : ''}" data-act="lk" data-k="${key}" data-i="${i}" data-x="${x + 1}" role="radio" aria-checked="${a[i] === x + 1}">${s}</button>`).join('')}${na ? `<button type="button" class="${a[i] === 0 ? 'on' : ''}" data-act="lk" data-k="${key}" data-i="${i}" data-x="0" role="radio" aria-checked="${a[i] === 0}">لم تتح فرصة للملاحظة</button>` : ''}</div></div>`).join('');
}
function stageBody(v, p, i) {
  const vid = v.id;
  if (i === 0 || i === 8) {
    const ph = i === 0 ? 'pre' : 'post';
    const prev = S.M.find(m => m.sid === S.me && m.vid === vid && m.ph === ph && m.src === 'self');
    const pre = S.M.find(m => m.sid === S.me && m.vid === vid && m.ph === 'pre' && m.src === 'self');
    let cmp = '';
    if (i === 8 && prev && pre) {
      const a = meanAns(pre.a), b = meanAns(prev.a);
      cmp = `<div class="res g2"><b>مقارنة رحلتك</b>${['قبل','بعد'].map((t, j) => `<div class="barrow"><span>${t}</span><div class="bar ${j ? '' : 'gold'}"><i style="width:${((j ? b : a) / 5 * 100).toFixed(0)}%"></i></div><span class="n">${fmt(j ? b : a)}</span></div>`).join('')}<p class="small" style="margin:6px 0 0">الفرق ${fmt(b - a, 2)} نقطة على مقياس من ١ إلى ٥. هذه قراءتك الذاتية للتأمل، وليست حكمًا عليك.</p></div>`;
    }
    return `${prev ? `<div class="notice">سجّلتِ هذا القياس في ${hijri(new Date(prev.at))}. يمكنك تعديله.</div>` : ''}

     ${likertHTML(vid + ph, v.items)}
     ${i === 8 ? `<label class="f">تأملي: ما الذي تغيّر فيك خلال رحلة هذه القيمة؟<textarea id="refl" maxlength="600">${esc(p.refl)}</textarea></label>` : ''}
     <div class="row" style="margin-top:12px"><button class="btn" data-act="saveMeasure" data-v="${vid}" data-ph="${ph}">${ic('check')} حفظ القياس</button></div>${cmp}`;
  }
  if (i === 1) return `<p style="font-size:1.12rem">${v.def}</p><div class="res"><b>لماذا تهمنا؟</b><br>${v.why}</div>
   <h3>أمثلة واقعية</h3><ul>${v.ex.map(x => `<li>${x}</li>`).join('')}</ul>
   <h3>محاور العالم</h3><div class="row">${v.topics.map(t => `<span class="chip">${t}</span>`).join('')}</div>
   <h3 style="margin-top:14px">دورة غَرْس</h3><div class="row small">${CYCLE.map((c, j) => `<span class="chip ${j <= 1 ? 'ok' : ''}">${AR(j + 1)}. ${c}</span>`).join('')}</div>

  if (i === 5) {
    const l = p.life || {};
    return `<p>اختاري تحديًا، وحددي هدفك وخطتك، ثم سجّلي ما نفذتِه.</p>
    <div class="grid g3">${v.ch.map((c, j) => `<button class="opt${l.ch === j ? ' pick' : ''}" data-act="pickCh" data-v="${vid}" data-i="${j}"><span class="chip">${c.f}</span> <b>${c.t}</b><br><span class="small muted">${c.d}</span></button>`).join('')}</div>
    <form data-form="life" data-v="${vid}" class="grid" style="margin-top:8px">
     <label class="f">هدفي<input name="goal" maxlength="160" value="${esc(l.goal || '')}" required></label>
     <label class="f">خطتي القصيرة<textarea name="plan" maxlength="400" required>${esc(l.plan || '')}</textarea></label>
     <label class="f">ماذا نفذتُ فعلًا؟<textarea name="done" maxlength="500" required>${esc(l.done || '')}</textarea></label>
     <button class="btn">${ic('check')} تسجيل التنفيذ</button></form>
    <p class="small muted">لا يلزم التصوير؛ الوصف الصادق يكفي، والتوثيق في المرحلة الثامنة.</p>`;
  }
  if (i === 6) {
    const inv = S.invites.find(x => x.sid === S.me && x.vid === vid);
    const url = inv ? linkFor('invite-' + inv.token) : '';
    return `<p>ادعي ولي أمرك ليشاركك نشاطًا قصيرًا ويضيف <b>بصمة الأسرة</b>. لا تُمنح البصمة بضغطة منك؛ بل من ولي الأمر عبر الرابط الآمن.</p>
    <div class="res"><b>نشاط «خمس دقائق تصنع أثرًا»</b><br>${v.fam.act}<br><b>سؤال الحوار:</b> ${v.fam.q}</div>
    ${p.fp.family ? `<div class="res g2 row">${fpArt('family', true, 54)}<span>شاركت أسرتك، ومُنحت بصمة الأسرة. شكرًا لهم!</span></div>` :
      inv ? `<div class="grid g2" style="align-items:center"><div>${qrSVG(url, 170, 'دعوة ولي الأمر')}</div><div><p class="small">رابط الدعوة (صالح لهذه القيمة فقط):</p><code style="direction:ltr;display:block" class="small">${esc(url)}</code>

       <p class="tiny muted">${LIVE ? 'أرسلي الرابط لولي أمرك (واتساب أو رسالة)، أو اطلبي منه مسح الباركود. الرابط خاص بك فلا تنشريه.' : 'في النسخة التجريبية تفتح الدعوة هنا. في التشغيل الفعلي يفتحها ولي الأمر من جهازه.'}</p></div></div>` :

/* ===== رفيق غَرْس (مساعد محدد القواعد) ===== */
function rafiqReply(q) {
  const t = q.replace(/[ًٌٍَُِّْ]/g, ''), v = VALUES.find(x => t.includes(x.n.replace('ال', '')) || t.includes(x.w)) || VBY[S.settings.weekValue];
  const role = S.role;
  if (/تشخيص|مرض|اكتئاب|قلق شديد|انتحار|أذى نفسي/.test(t)) return 'لا أقدم تشخيصات نفسية. إن كنتِ تمرين بضيق، تحدثي مع الموجهة الطلابية أو أحد والديك أو شخص بالغ تثقين به الآن.';
  if (/رقم الهوية|عنوان|جوال|صورة/.test(t)) return 'لا أحتاج إلى أي معلومات شخصية. يمكنك سؤالي عن القيم والأنشطة فقط.';
  if (/تقرير|مسود/.test(t) && ['teacher','counselor','supervisor','principal'].includes(role)) { const k = kpis({vid: v.id}), m = measureStats(v.id); return `مسودة ملخص لقيمة «${v.n}» (للمراجعة):\n• المشاركة: ${k.participation.value == null ? NOINFO : fmt(k.participation.value) + '٪'}\n• الإكمال: ${k.completion.value == null ? NOINFO : fmt(k.completion.value) + '٪'}\n• فرق متوسط القياس: ${m.diff == null ? NOINFO : fmt(m.diff, 2) + ' نقطة (ن=' + AR(m.n) + ')'}\n• توصية: تعزيز نشاط الأسرة «${v.fam.act.slice(0, 50)}…»\nراجعي الأرقام في مرصد الأثر قبل الاعتماد.`; }
  if (/استبان|استبيان|أداة/.test(t)) return `مسودة بنود قياس لقيمة «${v.n}» على مقياس خماسي (أبدًا ← دائمًا):\n${v.items.map((x, i) => (i + 1) + '. ' + x).join('\n')}\nتحتاج إلى تحكيم تربوي قبل الاستخدام الرسمي.`;
  if (/نشاط|أنشطة/.test(t) && role === 'parent') return `نشاط أسري لقيمة «${v.n}»:\n${v.fam.act}\nسؤال للحوار: ${v.fam.q}`;
  if (/نشاط|أنشطة|اقتراح/.test(t) && ['teacher','counselor','supervisor'].includes(role)) return `اقتراحات لقيمة «${v.n}»:\n• ${v.ch.map(c => c.t + ': ' + c.d).join('\n• ')}\n• مسرح المواقف: تمثيل حكاية «${v.stories[0].t}» ومناقشة بدائل القرار.`;
  if (/قصة|حكاية/.test(t)) { const s = v.stories[Math.floor(Math.random() * 3)]; return `حكاية «${s.t}» من عالم ${v.w}:\n${s.s.join(' ')}\n${s.q} ادخلي العالم لتختاري وتري أثر قرارك.`; }
  if (/تحد|ممارس|أطبق|كيف/.test(t)) return `أفكار لممارسة «${v.n}»:\n• ${v.ch.map(c => c.t + ' (' + c.f + '): ' + c.d).join('\n• ')}`;
  if (/تأمل|سؤال/.test(t)) return `أسئلة للتأمل في «${v.n}»:\n• ${v.stories.map(s => s.rf).join('\n• ')}`;
  if (/رسال|تشجيع/.test(t)) return `رسالة تشجيعية: «فخورون بخطواتك في ${v.w}. كل ممارسة صغيرة تصنعينها اليوم بذرة لأثر يبقى.»`;
  return `قيمة «${v.n}»: ${v.def}\nيمكنك أن تطلبي: قصة، أفكار ممارسة، أسئلة تأمل، رسالة تشجيع${['teacher','counselor','supervisor','principal'].includes(role) ? '، مسودة استبانة، مسودة تقرير' : role === 'parent' ? '، نشاط أسري' : ''}.`;
}

/* ===== مرصد الأثر وبوصلة القيم ===== */
UI.radarOff = {};
function radarSVG(series) {
  const W = 620, H = 520, cx = 310, cy = 268, R = 180, n = 9;
  const pt = (i, val) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n, r = R * (val - 1) / 4; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let s = `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="بوصلة غَرْس للقيم التسع">`;
  for (let l = 1; l <= 5; l++) { const p = VALUES.map((_, i) => pt(i, l).map(x => x.toFixed(1)).join(',')).join(' '); s += `<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="${l === 5 ? 1.5 : 1}"/>`; }
  for (let l = 2; l <= 5; l++) { const [x, y] = pt(0, l); s += `<text x="${x + 6}" y="${y + 4}" style="font-size:11px;fill:var(--mut)">${AR(l)}</text>`; }
  VALUES.forEach((v, i) => { const [x, y] = pt(i, 5), [lx, ly] = pt(i, 5.75); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><g class="ax" data-act="radarAx" data-v="${v.id}" tabindex="0" role="button" aria-label="تفاصيل ${v.n}"><rect x="${lx - 60}" y="${ly - 16}" width="120" height="30" rx="15" fill="${UI.radarV === v.id ? v.c : 'var(--card)'}" stroke="${v.c}"/><text x="${lx}" y="${ly + 5}" text-anchor="middle" style="${UI.radarV === v.id ? 'fill:#fff' : ''}">${v.n}</text></g>`; });
  series.forEach(se => {
    if (UI.radarOff[se.k]) return;
    const pts = se.vals.map((val, i) => val == null ? null : pt(i, val));
    if (!pts.some(Boolean)) return;
    if (pts.every(Boolean)) s += `<polygon points="${pts.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" fill="${se.c}" fill-opacity=".14" stroke="${se.c}" stroke-width="2.5" stroke-linejoin="round"/>`;
    else pts.forEach((p, i) => { const q = pts[(i + 1) % n]; if (p && q) s += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${se.c}" stroke-width="2.5"/>`; });
    pts.forEach(p => { if (p) s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${se.c}"/>`; });
  });
  return s + '</svg>';
}
function impactCard(v, src = 'self') {

  const bar = (lbl, val, cls) => `<div class="barrow"><span>${lbl}</span><div class="bar ${cls}"><i style="width:${val == null ? 0 : val / 5 * 100}%"></i></div><span class="n">${val == null ? '—' : fmt(val, 2)}</span></div>`;
  return `<div class="card" style="border-top:5px solid ${v.c}"><div class="row"><span style="color:${v.c}">${ic(v.ic, 26)}</span><h3 style="margin:0">${v.n}</h3><span class="sp tiny muted">${m.lastAt ? hijri(new Date(m.lastAt)) : ''}</span></div>
   ${m.ok ? `${bar('القبلي', m.pre, 'gold')}${bar('البعدي', m.post, '')}${bar('الاستدامة', m.sus, 'teal')}
   <div class="grid g3" style="margin-top:8px;gap:8px"><div class="stat"><b style="font-size:1.3rem">${(m.diff >= 0 ? '+' : '') + fmt(m.diff, 2)}</b><span class="tiny">فرق المتوسطين (نقطة)</span></div><div class="stat"><b style="font-size:1.3rem">${fmt(m.rel)}٪</b><span class="tiny">التغير النسبي</span></div><div class="stat"><b style="font-size:1.3rem">${fmt(m.pp)}</b><span class="tiny">نقطة مئوية (٠–١٠٠)</span></div></div>
   ${m.diff < 0 ? '<div class="res g0 small">انخفضت النتائج؛ يوصى بمراجعة الأنشطة وتعزيز المتابعة الفردية والأسرية.</div>' : ''}` : `<p class="kpi"><span class="v na">${NOINFO}</span></p><p class="tiny muted">تحتاج المقارنة إلى ${AR(S.settings.minN)} مشاركات على الأقل لديهن قياس قبلي وبعدي متناظر.</p>`}
   <div class="tiny muted" style="margin-top:6px">المشمولات بالمقارنة: ${AR(m.n)} · قبلي ${AR(m.nPre)} · بعدي ${AR(m.nPost)} · استدامة ${AR(m.nSusPaired)} · الاستجابة ${m.resp == null ? '—' : fmt(m.resp) + '٪'} · الإكمال ${k.completion.value == null ? '—' : fmt(k.completion.value) + '٪'}</div></div>`;

function svgToPng(svg, w, h, name) {
  const cs = getComputedStyle(document.documentElement);
  let str = svg.replace(/var\(--([\w-]+)\)/g, (m, n) => cs.getPropertyValue('--' + n).trim() || '#888');
  if (!/xmlns=/.test(str)) str = str.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  str = str.replace('<svg ', `<svg width="${w}" height="${h}" `);
  const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.scale(2, 2); x.drawImage(img, 0, 0, w, h); c.toBlob(b => b ? saveFile(name, b) : toast('تعذر إنشاء الصورة'), 'image/png'); };
  img.onerror = () => toast('تعذر إنشاء الصورة في هذا المتصفح'); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tour]'); if (t) { tour(+t.dataset.tour); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.classList.contains('ov')) closeTop(); return; }
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.getAttribute('role') === 'button' || el.tagName === 'g' || el.tagName === 'svg') e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast('حدث خطأ غير متوقع'); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][role="button"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { if ($('#deck')) ACT.deckClose(); else if ($('#show')) ACT.showClose(); else if ($('#intro')) endIntro(); else closeTop(); }
  if ($('#deck') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); deckGo(e.key === 'ArrowLeft' ? 1 : -1); }
});

}
function flashSaved() { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = 'حُفظ في قاعدة البيانات'; $$('.toast').forEach(x => x.remove()); document.body.appendChild(t); setTimeout(() => t.remove(), 1600); }
function queuePush() { busy = busy.then(push).catch(e => { console.error(e); toast(lerr(e)); }); return busy; }
async function lrun(fn, ok) { try { await fn(); if (ok) toast(ok); await sync(); render(); return true; } catch (e) { console.error(e); toast(lerr(e)); return false; } }

/* ===== الدخول ===== */
function vLogin() {
  const many = S.schools.length > 1;
  return `<div class="wrap band" style="max-width:980px"><h1>تسجيل الدخول</h1><div class="grid g2" style="align-items:start">
  <form data-form="stuLogin" class="card grid"><h2 style="margin:0">${ic('leaf')} دخول الطالبة</h2><p class="small muted">اكتبي رمز الدخول الذي أعطتك إياه معلمتك (ثمانية أحرف وأرقام). لا نطلب بريدًا أو رقم هوية.</p>
   <label class="f">رمز الدخول<input name="code" required minlength="6" maxlength="12" autocomplete="off" autocapitalize="characters" style="direction:ltr;text-align:center;font-size:1.3rem;letter-spacing:.2em"></label>
   <button class="btn gold">دخول</button></form>
  <form data-form="staffLogin" class="card grid"><h2 style="margin:0">${ic('book')} دخول المعلمات والإدارة</h2>
   ${many ? `<label class="f">المدرسة<select name="school">${S.schools.map(s => `<option value="${s.id}" ${S.school === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` : ''}
   <label class="f">البريد الإلكتروني<input name="email" type="email" required autocomplete="username" style="direction:ltr"></label>
   <label class="f">كلمة المرور<input name="pw" type="password" required minlength="6" autocomplete="current-password" style="direction:ltr"></label>
   <label class="f">الاسم (عند إنشاء حساب جديد فقط)<input name="name" maxlength="60"></label>
   <div class="row"><button class="btn" name="d" value="in">دخول</button><button class="btn ghost" name="d" value="up">إنشاء حساب جديد</button></div>
   <p class="tiny muted">الحساب الجديد يبقى بانتظار اعتماد مدير النظام أو مديرة المدرسة قبل ظهور أي بيانات.</p></form>
  <div class="card" style="grid-column:1/-1"><h3>${ic('heart')} أولياء الأمور</h3><p class="small">لا يحتاج ولي الأمر إلى حساب؛ يفتح رابط الدعوة الآمن الذي ترسله ابنته من المنصة.</p></div></div></div>`;
}
function vPending() { return `<div class="wrap band" style="max-width:720px"><div class="card"><h2>حسابك بانتظار الاعتماد</h2><p>سجّلتِ الدخول بنجاح. سيعتمد مدير النظام أو مديرة المدرسة دورك (معلمة، موجهة، قيادة…) ثم تظهر لك البوابة المناسبة.</p><button class="btn ghost" data-act="logout">تسجيل الخروج</button></div></div>`; }
function vSetup() {
  return `<div class="wrap band" style="max-width:760px"><h1>تهيئة المنصة لأول مرة</h1><p>أنتِ أول مستخدمة؛ ستصبحين <b>مدير النظام</b> وتنشئين المدرسة.</p>
  <form data-form="setup" class="card grid"><label class="f">اسم المدرسة<input name="school" required value="الثانوية الثامنة" maxlength="100"></label>
  <label class="f">الجهة<input name="admin" value="وزارة التعليم" maxlength="100"></label><label class="f">المرحلة<input name="stage" value="المرحلة الثانوية" maxlength="40"></label>
  <label class="f">مديرة المدرسة<input name="principal" value="أ. عفاف فرج الحربي" maxlength="60"></label><label class="f">اسمك<input name="me" value="أ. سعدى متعب سعود المطيري" maxlength="60"></label>
  <label class="f">العام الدراسي<input name="year" value="1448" maxlength="4" style="direction:ltr"></label><button class="btn gold">إنشاء المدرسة</button></form></div>`;
}
function vUsersCard() {
  if (!['sysadmin','principal'].includes(S.role)) return '';
  const rl = ['teacher','counselor','supervisor'].concat(S.role === 'sysadmin' ? ['principal','sysadmin'] : []);
  return `<div class="card" style="grid-column:1/-1"><h3>المستخدمون والصلاحيات</h3><div class="scroll"><table class="stack"><thead><tr><th>الاسم</th><th>الدور</th></tr></thead><tbody>
  ${S.users.map(u => `<tr><td>${esc(u.name || '—')}${u.user_id === S.user.id ? ' <span class="chip">أنتِ</span>' : ''}${!u.role ? ' <span class="chip wait">بانتظار الاعتماد</span>' : ''}</td><td>${u.user_id === S.user.id ? esc(ROLES[u.role]) : `<select data-ch="userRole" data-k="${u.user_id}" style="max-width:220px"><option value="">— بلا صلاحية —</option>${rl.map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLES[r]}</option>`).join('')}</select>`}</td></tr>`).join('') || '<tr><td colspan="2">لا يوجد مستخدمون</td></tr>'}</tbody></table></div>
  <p class="tiny muted">تُنشئ المعلمة حسابها من صفحة الدخول (البريد وكلمة المرور)، ثم تعتمدينها هنا.</p></div>`;
}
async function evFile(path) { try { const r = await rq(sb.storage.from('gh-evidence').createSignedUrl(path, 600)); const a = document.createElement('a'); a.href = r.signedUrl; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast(lerr(e)); } }
function codesDoc() {
  const by = {}; scope().forEach(s => (by[s.cls] = by[s.cls] || []).push(s)); const u = linkFor('login');
  const body = `<h1>بطاقات دخول الطالبات</h1><p style="text-align:center">رابط المنصة: <span style="direction:ltr">${esc(u)}</span> — تُسلَّم كل بطاقة لصاحبتها فقط.</p>${Object.entries(by).map(([c, a]) => `<h2>${esc(clsName(c))}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${a.map(s => `<div class="keep" style="border:1px dashed #073B2D;border-radius:8px;padding:8px;display:flex;gap:10px;align-items:center">${qrSVG(u, 74)}<div><b>${esc(s.n)}</b><br>رمز الدخول: <b style="font-size:16pt;letter-spacing:2px;direction:ltr;display:inline-block">${esc(s.code || '')}</b></div></div>`).join('')}</div>`).join('')}`;
  return docWrap('بطاقات دخول الطالبات', body);
}

/* ===== تفعيل الطبقة ===== */
if (LIVE) {
  ROUTES.login = vLogin;
  persist = () => { try { localStorage.setItem(KEY + '-ui', JSON.stringify(S.ui)); } catch (e) {} };
  after = () => { render(); queuePush(); };
  notify = (to, text) => { if (isStaffRole() && (to === 'all' || to === 'student') && S._notifOk) (S._notifNew = S._notifNew || []).push({to, text}); };
  audit = what => { if (isStaffRole()) S.audit.unshift({id: uid('a'), role: S.role, what, at: Date.now()}); };
  const _render = render;
  render = function () {
    const r = route();
    if (!S.schools.length && !S.user) { $('#app').innerHTML = `<div class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div class="wrap">${logo(120)}<h1>غَرْس 360</h1><p class="lead" style="margin:auto">${S._loading ? 'جارٍ التحميل…' : 'المنصة لم تُهيأ بعد. سجّلي الدخول بحساب الإدارة لإنشاء المدرسة.'}</p>${S._loading ? '' : '<a class="btn gold" href="#login" data-act="showLogin">تسجيل الدخول</a>'}</div></div>${S._showLogin ? vLogin() : ''}`; return; }
    if (S.user && !S.schools.length) { _render(); $('#main').innerHTML = vSetup(); return; }
    if (S.user && !S.role) { _render(); $('#main').innerHTML = vPending(); return; }
    const stuOnly = /^(world-|tree$|card$|d21$|capsule$|me$)/.test(r), staffOnly = ['teacher','evidence','leader','counselor','observatory','reports','committee','plan','risks','exhibit','school-setup'].includes(r);
    if (S.role === 'guest' && (stuOnly || staffOnly)) { _render(); $('#main').innerHTML = `<div class="wrap band"><div class="notice" style="margin-bottom:12px">${stuOnly ? 'سجّلي الدخول برمزك لبدء رحلتك وحفظ تقدمك.' : 'هذه الصفحة لمنسوبات المدرسة بعد تسجيل الدخول.'}</div></div>` + vLogin(); return; }
    if (S.role === 'student' && staffOnly) { location.hash = 'home'; return; }
    _render();
  };
  ACT.showLogin = () => { S._showLogin = true; render(); };
  ACT.logout = async () => { lset(CODE_KEY, ''); try { await sb.auth.signOut(); } catch (e) {} S.user = null; S.role = 'guest'; S.me = ''; await sync(); go('home'); render(); toast('سُجّل الخروج'); };
  ACT.openInvite = () => toast('أرسلي الرابط أو الباركود لولي الأمر ليفتحه من جهازه.');
  ACT.altOk = el => lrun(() => rq(sb.rpc('gh_alt_ok', {p_student: el.dataset.s, p_vid: el.dataset.v})), 'اعتُمد المسار البديل');
  ACT.follow = el => { const sid = el.dataset.s, vid = el.dataset.v, day = +(($(`[data-ch="folDay"][data-k="${sid}|${vid}"]`) || {}).value || 30); return lrun(() => rq(sb.rpc('gh_follow_up', {p_student: sid, p_vid: vid, p_day: day, p_res: el.dataset.r})), 'سُجلت المتابعة'); };
  ACT.evFile = el => evFile(el.dataset.p);
  ACT.codes = () => docPreview('بطاقات دخول الطالبات', codesDoc(), 'بطاقات-دخول-الطالبات.html');
  ACT.readAll = async () => { if (S.role === 'student') { S.ui.readN = Date.now(); persist(); await sync(); render(); return; } lrun(() => rq(sb.from('gh_notifs').update({is_read: true}).eq('school_id', S.school).eq('is_read', false))); };
  ACT.setSchool = () => toast('لكل مدرسة حسابات منسوباتها؛ تُدار بياناتها عند الدخول بحساب تابع لها.');
  FORMS.addSchool = (f, d) => lrun(() => rq(sb.rpc('gh_add_school', {p_name: d.n})), 'أُضيفت المدرسة؛ اعتمدي لها مديرة من قائمة المستخدمين');
  FORMS.encourage = (f, d) => { S._notifOk = true; notify('student', 'رسالة من المعلمة: ' + d.t); S._notifOk = false; after(); toast('أُرسلت داخل المنصة'); };
  FORMS.newCh = (f, d) => { const c = S.settings.customCh = S.settings.customCh || {}; (c[d.vid] = c[d.vid] || []).push({t: d.t, d: d.d, f: d.f}); VBY[d.vid].ch.push({t: d.t, d: d.d, f: d.f}); after(); toast('أُضيف التحدي'); };
  FORMS.chain = (f, d) => { (S._chainNew = S._chainNew || []).push({lv: d.lv, t: d.t, vid: S.settings.weekValue}); after(); toast('أُضيفت حلقة جديدة'); };
  FORMS.stuLogin = async (f, d) => {
    const code = d.code.toUpperCase().replace(/\s/g, '');
    try { const r = await rq(sb.rpc('gh_s_data', {p_code: code})); lset(CODE_KEY, code); S.role = 'student'; S.me = r.student.id; S.user = null; await sync(); toast('مرحبًا ' + r.student.name.split(' ')[0]); go('city'); render(); }
    catch (e) { toast(lerr(e)); }
  };
  FORMS.staffLogin = async (f, d, sub) => {
    try {
      if (d.school) lset(SCH_KEY, d.school);
      const r = sub === 'up' ? await sb.auth.signUp({email: d.email, password: d.pw}) : await sb.auth.signInWithPassword({email: d.email, password: d.pw});
      if (r.error) throw r.error;
      if (!r.data.session) { toast('أُنشئ الحساب. فعّلي الحساب من بريدك ثم سجّلي الدخول.'); return; }
      if (sub === 'up' || d.name) await rq(sb.rpc('gh_register', {p_name: d.name || ''}));
      lset(CODE_KEY, ''); await afterAuth(); go(isStaffRole() ? ((NAV[S.role] || [])[1] || ['home'])[0] : 'home'); render();
    } catch (e) { toast(lerr(e)); }
  };
  FORMS.setup = async (f, d) => {
    const settings = {admin: d.admin, stage: d.stage, principal: d.principal, supervisor: d.me, year: d.year || '1448', years: [d.year || '1448']};
    try { await rq(sb.rpc('gh_setup', {p_name: d.school, p_settings: settings, p_me: d.me})); await afterAuth(); toast('أُنشئت المدرسة، وأنتِ مدير النظام'); go('school-setup'); render(); } catch (e) { toast(lerr(e)); }
  };
  FORMS.evid = async (f, d) => {
    const file = f.file.files[0], btn = $('button', f); let path = null;
    if (file && file.size > 10 * 1024 * 1024) return toast('حجم الملف أكبر من ١٠ ميغابايت');
    if (btn) { btn.disabled = true; btn.textContent = 'جارٍ الإرسال…'; }
    try {
      if (file) { path = `${S.school}/${S.me}/${uid()}-${String(file.name).replace(/[^\w.\-]+/g, '_').slice(-50)}`; await rq(sb.storage.from('gh-evidence').upload(path, file, {contentType: file.type})); }
      await rq(sb.rpc('gh_s_evidence', {p_code: lget(CODE_KEY), p_vid: f.dataset.v, p_type: d.type, p_text: d.text, p_file: path, p_mural: !!d.mural, p_year: S.settings.year}));
      toast('أُرسل الشاهد للمعلمة'); await sync(); render();
    } catch (e) { console.error(e); toast(lerr(e)); if (btn) { btn.disabled = false; btn.textContent = 'إرسال الشاهد للمراجعة'; } }
  };
  FORMS.family = async (f, d) => {
    try { await rq(sb.rpc('gh_p_submit', {p_token: S.ptoken, p_note: d.note, p_msg: d.msg || ''})); const vid = S.pinv.vid; await sync(); UI.envOpen = false; render(); celebrate('family', vid); } catch (e) { toast(lerr(e)); }
  };
  const _change = e => {
    const el = e.target.closest('[data-ch="userRole"]'); if (!el) return; e.stopImmediatePropagation();
    lrun(() => rq(sb.rpc('gh_set_role', {p_user: el.dataset.k, p_role: el.value || null, p_school: S.school})), 'حُدّثت الصلاحية');
  };
  document.addEventListener('change', _change, true);
}
async function afterAuth() {
  const s = (await sb.auth.getSession()).data.session;
  if (!s) { S.user = null; if (S.role !== 'student' && S.role !== 'parent') S.role = 'guest'; await sync(); return; }
  let prof = null; try { prof = (await rq(sb.from('gh_profiles').select('*').eq('user_id', s.user.id)))[0]; } catch (e) {}
  if (!prof) { try { await rq(sb.rpc('gh_register', {p_name: ''})); } catch (e) {} }
  S.user = {id: s.user.id, email: s.user.email, name: (prof && prof.name) || s.user.email};
  S.role = prof && prof.role && prof.school_id ? prof.role : '';
  if (prof && prof.school_id) S.school = prof.school_id;
  await sync();
}
async function liveBoot() {
  S._loading = true; render();
  try { sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: true}}); }
  catch (e) { S._loading = false; $('#app').innerHTML = '<div class="wrap band"><div class="card"><h2>تعذّر تحميل مكتبة الاتصال</h2><p>تحققي من الاتصال بالإنترنت ثم أعيدي تحميل الصفحة.</p></div></div>'; return; }
  const r = route();
  if (r.startsWith('invite-')) { S.ptoken = r.slice(7); S.role = 'parent'; }
  else if (lget(CODE_KEY)) S.role = 'student';
  if (S.role === 'guest' || !S.role) await afterAuth(); else await sync();
  S._loading = false; render();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.user) { S.user = null; S.role = 'guest'; sync().then(render); } });
}

/* ===== البدء ===== */
S = load(); applyUi();
if (LIVE) liveBoot(); else render();
if (!S.ui.introSeen && !location.hash) intro();
(function hook(n) {
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(d => { DL = d; }).catch(() => {});
    window.claude.use('tts').then(t => { TTS = t; }).catch(() => {});
  } else if (n < 10) setTimeout(() => hook(n + 1), 300);
})(0);
window.__ghars = {get S() { return S; }, persist, render, kpis, measureStats, familyStats, repValueDoc, repFileDoc, UI};

}
</script>
</body>
</html>
