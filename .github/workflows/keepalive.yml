# يُبقي قاعدة بيانات المنصتين نشطة: يطرقها كل ثلاثة أيام حتى لا توقفها الخطة المجانية.
# أنشئيه في GitHub بالمسار: .github/workflows/keepalive.yml
name: keep-alive
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -s -o /dev/null -w "basma %{http_code}\n" "https://ecucdsdogyccdekczokj.supabase.co/rest/v1/af_site?select=id" -H "apikey: sb_publishable_GZuEu9ik3AyBQMTv_sEnjQ_fEka30hT"
          curl -s -o /dev/null -w "ghars %{http_code}\n" "https://ecucdsdogyccdekczokj.supabase.co/rest/v1/gh_schools?select=id&limit=1" -H "apikey: sb_publishable_GZuEu9ik3AyBQMTv_sEnjQ_fEka30hT"
      - uses: actions/checkout@v4
      - name: Monthly heartbeat (keeps the schedule enabled)
        run: |
          if [ "$(date -u +%d)" -le 03 ]; then
            date -u > .heartbeat
            git config user.name "keep-alive"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat && git commit -m "heartbeat" && git push || true
          fi
