<style>:root{--g:#087F69;--t:#36B6A2;--d:#124C43;--gold:#D4AD60;--mint:#F1F6F3;--bg:#F1F6F3;--card:#fff;--ink:#1F2A27;--mut:#5E6E68;--line:#DCE7E2;--bad:#C2554D;--warn:#B8862F;--ok:#0E9F6E;--r:16px;--sh:0 1px 2px rgba(18,76,67,.05),0 6px 22px rgba(18,76,67,.08);
--f:'IBM Plex Sans Arabic','Cairo','Tajawal',system-ui,sans-serif}
html.dark{--bg:#0E1C19;--card:#162925;--ink:#E7F1ED;--mut:#9DB3AB;--line:#24403A;--mint:#122420;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.7;font-size:1rem}
h1,h2,h3{line-height:1.35;margin:0;font-weight:700}a{color:var(--g)}button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.skip{position:absolute;top:-60px;right:10px;background:var(--d);color:#fff;padding:8px 14px;border-radius:10px;z-index:99}.skip:focus{top:8px}
html.calm *,html.calm *:before,html.calm *:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* الشاشة الافتتاحية */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 10%,#0B9478,#087F69 40%,#124C43);color:#fff;text-align:center;transition:opacity .5s}
.splash.out{opacity:0;pointer-events:none}.splash svg.sp{width:180px;height:180px}
.sp .seed{animation:seed 1s ease both}.sp .stem{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s .7s ease forwards}.sp .lf1{transform-origin:90px 92px;animation:leaf .6s 1.2s ease both}.sp .lf2{transform-origin:90px 98px;animation:leaf .6s 1.4s ease both}
.sp .bk{opacity:0;animation:fade .7s 1.7s ease forwards}.sp .pth{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1s 2s ease forwards}
@keyframes seed{0%{transform:translateY(-30px) scale(.4);opacity:0}100%{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes leaf{from{transform:scale(0)}to{transform:scale(1)}}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.splash .ph1{font-size:1.15rem;opacity:0;animation:fade .7s 2.3s forwards}.splash .ph2{font-size:2.4rem;font-weight:700;color:var(--gold);opacity:0;animation:fade .7s 2.8s forwards}.splash .ph3{opacity:0;animation:fade .7s 3.1s forwards;font-size:.95rem}
.splash .skipb{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:8px 18px;cursor:pointer}

/* الهيكل */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(180deg,var(--d),#0E3B34);color:#fff;box-shadow:0 4px 16px rgba(18,76,67,.25)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}.brand b{font-size:1.15rem;display:block;line-height:1.2}.brand small{display:block;font-size:.75rem;color:#BFE3D9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.tsp{flex:1}.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:inherit;cursor:pointer}.ib svg{width:20px;height:20px}.ib.sm{width:28px;height:28px;background:transparent}
.card .ib,.modal .mb .ib{background:var(--mint);color:var(--ink)}
.ysel{background:rgba(255,255,255,.12);border:1px solid rgba(212,173,96,.6);color:#F6E7C4;border-radius:999px;padding:6px 10px;font-weight:600}.ysel option{color:#111}
.rail{display:none}.bnav{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--mut);text-decoration:none;font-size:.78rem;font-weight:600}.tab.on{color:var(--g);background:var(--mint)}
main{max-width:1200px;margin:auto;padding:16px 14px 96px}
@media(min-width:1024px){.bnav{display:none}.menu-b{display:inline-grid}.rail{display:flex;flex-direction:column;gap:4px;position:fixed;top:64px;right:0;bottom:0;width:96px;padding:12px 8px;background:var(--card);border-inline-start:1px solid var(--line);z-index:20}.rsp{flex:1}main{margin-right:96px;padding:22px 28px 40px}body{padding-right:0}}
.drawer{position:fixed;inset-block:0;right:0;width:min(330px,88vw);z-index:60;background:var(--card);box-shadow:-10px 0 40px rgba(0,0,0,.25);padding:14px;overflow:auto;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(100%)}}.dhd{display:flex;gap:10px;align-items:center;margin-bottom:10px}.dhd>div{flex:1}.drawer a{display:flex;gap:10px;align-items:center;padding:10px 8px;border-radius:12px;text-decoration:none;color:var(--ink)}.drawer a:hover{background:var(--mint)}
.dset{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.attr{font-size:.78rem;color:var(--mut);border-top:1px solid var(--line);padding-top:10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}

/* مكونات */
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin:4px 0 14px}.ph h1{font-size:1.6rem;color:var(--d)}html.dark .ph h1{color:#CFEDE4}.sub{margin:2px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}.ct{font-size:1.1rem;color:var(--d);margin-bottom:10px}html.dark .ct{color:#CFEDE4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.6rem;color:var(--g)}.stat span{font-size:.85rem;color:var(--mut)}.stat small{display:block;font-size:.72rem;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.tile{position:relative}.tile a{display:flex;flex-direction:column;gap:4px;height:100%;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);text-decoration:none;color:var(--ink);transition:transform .2s,border-color .2s}.tile a:hover{transform:translateY(-3px);border-color:var(--t)}
.tic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--g),var(--t));color:#fff;margin-bottom:4px}.tile b{font-size:1.02rem}.tile small{color:var(--mut);font-size:.82rem;line-height:1.5}
.fav{position:absolute;top:10px;left:10px;border:0;background:none;font-size:1.25rem;color:#C9D6D1;cursor:pointer}.fav.on{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;color:var(--d);text-decoration:none}html.dark .btn{color:#CFEDE4}.btn:hover{border-color:var(--t)}
.btn.pri{background:linear-gradient(180deg,#0A8E76,var(--g));border-color:var(--g);color:#fff}.btn.gold{background:linear-gradient(180deg,#E6C67F,var(--gold));border-color:#C59B48;color:#2A1F07}.btn.del{color:var(--bad)}.btn.sm{min-height:34px;padding:4px 10px;font-size:.85rem;border-radius:10px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--mint);color:var(--d)}.badge.ok{background:#DDF3EA;color:var(--ok)}.badge.warn{background:#FBF0D8;color:var(--warn)}.badge.bad{background:#F8E1DF;color:var(--bad)}.badge.gold{background:#F6EBD3;color:#7A5A16}
.empty{color:var(--mut);padding:8px 2px}.note{background:#FFF8E6;border:1px solid #EBD9A6;color:#6B5418;border-radius:12px;padding:10px 14px;font-size:.9rem}html.dark .note{background:#2B2614;color:#E8D9A8;border-color:#4C4223}
.list{display:grid;gap:8px}.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}.row .t{flex:1;min-width:0}.row b{display:block}.row small{color:var(--mut)}
.f{display:grid;gap:4px;margin-bottom:12px}.f label,.f legend{font-weight:700;font-size:.9rem;color:var(--d)}html.dark .f label,html.dark .f legend{color:#CFEDE4}
.f input,.f select,.f textarea,.inp{width:100%;padding:10px 12px;border:1px solid #CBDAD4;border-radius:12px;background:var(--card);font-size:1rem}html.dark .f input,html.dark .f select,html.dark .f textarea{border-color:var(--line)}
.f .h,.h{font-size:.78rem;color:var(--mut)}fieldset.f{border:1px solid var(--line);border-radius:14px;padding:10px 12px}.chk{display:flex;gap:8px;align-items:center;margin:6px 0 12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;max-height:240px;overflow:auto;padding:4px}.checks label{display:flex;gap:6px;align-items:center;font-size:.9rem}.pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.pick select{padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.attb{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}@media(max-width:520px){.attb{grid-template-columns:repeat(3,1fr)}}.abtn{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border:1.5px dashed var(--gold);border-radius:12px;background:#FFFCF3;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--d)}html.dark .abtn{background:#1E2A1F}
.linkbox{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.linkbox input{flex:1;min-width:140px;padding:8px;border:1px solid var(--line);border-radius:10px}.files{display:grid;gap:4px;margin-top:6px}.file{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.88rem}.file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.ov{position:fixed;inset:0;z-index:70;background:rgba(12,40,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto;animation:fade .2s}
.modal{width:min(680px,100%);background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.3);overflow:hidden}.ov.wide .modal{width:min(980px,100%)}.ov.full{padding:0}.ov.full .modal{width:100%;min-height:100vh;border-radius:0}
.mh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(180deg,var(--d),#0E3B34);color:#fff}.mh h2{flex:1;font-size:1.15rem}.mb{padding:16px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:99;background:var(--d);color:#fff;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;box-shadow:var(--sh);font-size:.92rem;max-width:92vw;animation:fade .25s}
.busy{position:fixed;inset:0;z-index:98;background:rgba(255,255,255,.5);display:grid;place-items:center}.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--g);animation:sp 1s linear infinite;margin:auto}@keyframes sp{to{transform:rotate(360deg)}}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--mut)}
.chart{width:100%;height:auto;display:block}.chart .gl{stroke:var(--line)}.chart .ax{font-size:11px;fill:var(--mut);font-family:var(--f)}.chart .bv{font-size:11px;font-weight:700;fill:var(--d);font-family:var(--f)}html.dark .chart .bv{fill:#CFEDE4}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.ring{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.ring svg{width:96px;height:96px}.ring .rbg{stroke:var(--mint)}.ring .rv{font-size:17px;font-weight:700;fill:var(--d);font-family:var(--f)}html.dark .ring .rv{fill:#CFEDE4}.ring b{display:block;font-size:.85rem}.ring small{color:var(--mut);font-size:.72rem}
.tw{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:start;vertical-align:top}.tbl th{background:var(--mint);position:sticky;top:0}.sortb{border:0;background:none;font-weight:700;cursor:pointer;padding:0;color:var(--d)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}.seg button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;font-weight:600}.seg button.on{background:var(--g);color:#fff}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:radial-gradient(110% 120% at 90% 0%,#0FA187,#087F69 45%,#124C43);box-shadow:var(--sh);margin-bottom:14px}
.hero h1{font-size:1.7rem}.hero p{margin:4px 0 0;color:#D9F1EA}.hero .lg{position:absolute;left:-10px;bottom:-14px;opacity:.15;transform:rotate(-12deg)}
.prog{height:9px;border-radius:9px;background:var(--mint);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--t))}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.ctl select,.ctl input{padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* الظرف الإلكتروني */
.env{position:relative;width:min(320px,80vw);aspect-ratio:1.45;margin:18px auto;cursor:pointer;perspective:800px}.env .bd{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#FFFDF6,#F4E9CF);box-shadow:0 14px 34px rgba(18,76,67,.25);border:1px solid #E6D2A2}
.env .fl{position:absolute;top:0;inset-inline:0;height:58%;transform-origin:top;background:linear-gradient(180deg,#EFDDB2,#E3C98F);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .7s;z-index:3;border-radius:14px 14px 0 0}
.env .sealx{position:absolute;top:44%;left:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1BA587,#087F69);border:2px solid var(--gold);display:grid;place-items:center;color:#fff;z-index:4;transition:opacity .4s}
.env.open .fl{transform:rotateX(180deg);z-index:1}.env.open .sealx{opacity:0}.env .lt{position:absolute;inset:10% 8% 6%;background:#fff;border-radius:10px;z-index:2;padding:14px;transform:translateY(0);transition:transform .8s .35s;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow:hidden;font-size:.95rem}
.env.open .lt{transform:translateY(-62%)}.letter{max-width:520px;margin:10px auto;background:linear-gradient(180deg,#fff,#FFFBF1);border:1px solid #EBD9A6;border-radius:18px;padding:20px;text-align:center;box-shadow:var(--sh);animation:fade .6s}
.letter h3{color:var(--g);font-size:1.3rem}.letter p{font-size:1.1rem;line-height:1.9}html.dark .letter{background:#1E2A22;border-color:#4C4223}

/* المستند */
#doc{position:fixed;inset:0;z-index:80;background:#DDE5E1;overflow:auto}body.docopen{overflow:hidden}.dtool{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:var(--d)}
.page{width:210mm;min-height:297mm;margin:14px auto;background:#fff;color:#1F2A27;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:14mm 15mm 18mm;font-size:11.5pt;line-height:1.75;position:relative}
#doc.land .page{width:297mm;min-height:210mm}@media(max-width:820px){.page,#doc.land .page{width:100%;min-height:auto;padding:16px 12px 40px;margin:8px 0}}
.phd{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border-bottom:2px solid var(--g);padding-bottom:8px;margin-bottom:10px}.phd .pl{text-align:end;font-size:10pt}.phd .pc{display:flex;gap:10px;justify-content:center}.phd img{height:56px;max-width:120px;object-fit:contain}
.dt{text-align:center;color:var(--d);font-size:18pt;margin:6px 0 2px}.dm{text-align:center;color:#5E6E68;font-size:9.5pt;margin:0 0 10px}
.page h2{font-size:13.5pt;color:var(--g);border-inline-start:5px solid var(--gold);padding-inline-start:8px;margin:14px 0 6px;break-after:avoid}.page h3{font-size:12pt;margin:10px 0 4px;color:var(--d)}
.page table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:10pt}.page th,.page td{border:1px solid #BFD0C9;padding:5px 7px;text-align:start;vertical-align:top}.page th{background:#E4F2EC;color:var(--d)}
.page .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22px;text-align:center}.page .sig div{border-top:1px solid #333;padding-top:6px;min-height:60px}.src{font-size:8.5pt;color:#6b766f;margin-top:10px}
.pf{margin-top:10px;border-top:1px solid var(--gold);padding-top:4px;text-align:center;font-size:8pt;color:#6b766f}.pn{position:absolute;bottom:8mm;left:15mm;font-size:8.5pt;color:#6b766f}
.na{color:#8a5a10;font-style:italic}.keep{break-inside:avoid}
@page land{size:A4 landscape;margin:0}@media print{@page{size:A4;margin:0}#doc.land .page{page:land}body{background:#fff}body>*:not(#doc){display:none!important}#doc{position:static;background:#fff;overflow:visible}.dtool{display:none}.page{margin:0;box-shadow:none;break-after:page;width:210mm;min-height:297mm}#doc.land .page{width:297mm;min-height:210mm}.page:last-child{break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== أنماط الوحدات ===== */
.crumb{font-size:.85rem;color:var(--mut);margin-bottom:6px}.crumb a{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chips span,.chips .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.88rem}.chip .x{border:0;background:none;cursor:pointer;color:var(--mut)}
.big{font-size:1.25rem;line-height:1.8}.huge{font-size:2.4rem;font-weight:700;color:var(--g);line-height:1.4}.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}.hidden{display:none!important}.h2{font-size:1rem}

const Cloud = {
  c: null,
  init() { this.c = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth: {persistSession: true, storageKey: 'ga-auth'}}); },
  ok(r) { if (r.error) throw r.error; return r.data; },
  async session() { const {data} = await this.c.auth.getSession(); return data.session ? {id: data.session.user.id, email: data.session.user.email} : null; },
  async signIn(email, pw) { const u = this.ok(await this.c.auth.signInWithPassword({email, password: pw})).user; return {id: u.id, email: u.email}; },
  async signUp(email, pw, name) { const d = this.ok(await this.c.auth.signUp({email, password: pw, options: {data: {name}}})); if (!d.session) { const e = new Error('confirm'); throw e; } return {id: d.user.id, email: d.user.email}; },
  async signOut() { await this.c.auth.signOut(); },
  async setPw(pw) { this.ok(await this.c.auth.updateUser({password: pw})); },
  async select(t, f = {}) {
    const out = []; let from = 0;
    for (;;) { let q = this.c.from(t).select('*'); Object.entries(f).forEach(([k, v]) => { if (v === undefined) return; q = v === null ? q.is(k, null) : q.eq(k, v); });
      const page = this.ok(await q.range(from, from + 999)); out.push(...page); if (page.length < 1000) break; from += 1000; }
    return out; },
  async ins(t, row) { return this.ok(await this.c.from(t).insert(row).select().single()); },
  async upd(t, id, patch) { return this.ok(await this.c.from(t).update(Object.assign({}, patch, t === 'ga_records' ? {updated_at: nowIso()} : {})).eq(t === 'ga_links' ? 'token' : 'id', id).select().single()); },
  async del(t, id) { this.ok(await this.c.from(t).delete().eq(t === 'ga_links' ? 'token' : 'id', id)); },
  async upload(path, file) { this.ok(await this.c.storage.from('ga-files').upload(path, file, {contentType: file.type || 'application/octet-stream'})); return path; },
  async url(path) { const r = await this.c.storage.from('ga-files').createSignedUrl(path, 3600); return r.error ? '' : r.data.signedUrl; },
  async rm(paths) { if (paths.length) await this.c.storage.from('ga-files').remove(paths); },
  async rpc(fn, a) { return this.ok(await this.c.rpc(fn, a)); }

async function loadMine() {
  S.mems = await DB.select('ga_members', {user_id: S.me.id});
  const ids = S.mems.map(m => m.school_id);
  S.schools = (await DB.select('ga_schools')).filter(s => ids.includes(s.id) || S.mems.some(m => m.role === 'sysadmin' && m.status === 'active'));
}
async function loadSchool() {
  const act = S.mems.filter(m => m.status === 'active');
  const pick = act.find(m => m.school_id === S.ui.school) || act[0];
  if (!pick) { S.school = null; S.role = null; return; }
  S.school = S.schools.find(s => s.id === pick.school_id) || (await DB.select('ga_schools', {id: pick.school_id}))[0];
  S.school.settings = S.school.settings || {};
  S.role = pick.role; S.ui.school = S.school.id; saveUi();
  S.years = (await DB.select('ga_years', {school_id: S.school.id})).sort((a, b) => b.name.localeCompare(a.name));
  S.year = S.years.find(y => y.id === S.ui.year) || S.years.find(y => !y.archived) || S.years[0] || null;
  S.members = await DB.select('ga_members', {school_id: S.school.id});
  if (!S.year) { S.classes = []; S.students = []; S.recs = []; return; }

function modal(title, body, o = {}) { closeModal(); const ov = document.createElement('div'); ov.className = 'ov' + (o.wide ? ' wide' : '') + (o.full ? ' full' : ''); ov.id = 'ov';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mh"><h2 id="mt">${G(title)}</h2><button class="ib" data-act="close" aria-label="إغلاق">${ic('x')}</button></div><div class="mb">${G(body)}</div></div>`;

  const id = 'f-' + k, val = v == null ? (o.def != null ? o.def : '') : v, req = o.req ? 'required' : '', lab = `<label for="${id}">${G(l)}${o.req ? ' *' : ''}</label>`;

  else if (t === 'select') inp = `<select id="${id}" data-k="${k}" ${req}>${(o.opts || []).map(x => { const [ov, ol] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(ov)}" ${String(ov) === String(val) ? 'selected' : ''}>${esc(G(ol))}</option>`; }).join('')}</select>`;
  else if (t === 'class') inp = `<select id="${id}" data-k="${k}" ${req}>${o.all !== false ? `<option value="">كل الفصول</option>` : ''}${S.classes.map(c => `<option value="${c.id}" ${c.id === val ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  else if (t === 'student') inp = `<select id="${id}" data-k="${k}" ${req}><option value="">— اختر{ي} —</option>${S.classes.map(c => `<optgroup label="${esc(c.name)}">${stuOf(c.id).map(s => `<option value="${s.id}" ${s.id === val ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>`).join('')}${stuOf().filter(s => !s.class_id).map(s => `<option value="${s.id}" ${s.id === val ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`;
  else if (t === 'students') return `<fieldset class="f"><legend>${G(l)}</legend><div class="pick"><select data-pickcls aria-label="تصفية حسب الفصل"><option value="">كل الفصول</option>${S.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button type="button" class="btn sm" data-act="pickAll">تحديد الظاهر</button><button type="button" class="btn sm" data-act="pickNone">إلغاء التحديد</button></div><div class="checks" data-k="${k}" data-multi>${stuOf().map(s => `<label data-c="${s.class_id || ''}"><input type="checkbox" value="${s.id}" ${(val || []).includes(s.id) ? 'checked' : ''}> ${esc(s.name)}</label>`).join('') || '<p class="empty">أضف{ي} ' + STUS() + ' أولًا من «الفصول و' + STUS() + '».</p>'}</div></fieldset>`;

  else if (t === 'check') return `<label class="chk"><input type="checkbox" id="${id}" data-k="${k}" ${val ? 'checked' : ''}> ${G(l)}</label>`;

function drawPend() { const l = $('[data-filelist]'); if (!l) return; l.querySelectorAll('.new').forEach(x => x.remove()); PEND.forEach((f, i) => l.insertAdjacentHTML('beforeend', `<div class="file new"><span>${f.link ? '🔗' : '⇪'} ${esc(f.name)}</span><button type="button" class="ib sm" data-act="rmPend" data-i="${i}" aria-label="إزالة">${ic('x', 14)}</button></div>`)); }
async function filesFrom(form, old = []) { const keep = fileKeep(form); const files = old.filter(x => keep.includes(x.path)); const nw = await uploadFiles(PEND, 'files'); const gone = old.filter(x => !keep.includes(x.path) && !/^link:/.test(x.path)).map(x => x.path); if (gone.length) DB.rm(gone).catch(() => {}); PEND = []; return files.concat(nw); }

/* ===== الرسوم البيانية (SVG تعتمد على البيانات فقط) ===== */
function bars(data, o = {}) { if (!data.length || data.every(d => d.v == null)) return empty(NOINFO); const W = o.w || 640, H = o.h || 240, pad = 34, mx = o.max || Math.max(1, ...data.map(d => d.v || 0)), bw = (W - pad * 2) / data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 40}" role="img" aria-label="${esc(o.label || 'رسم بياني')}">${[0, .25, .5, .75, 1].map(t => `<line x1="${pad}" x2="${W - pad}" y1="${H - (H - 20) * t}" y2="${H - (H - 20) * t}" class="gl"/><text x="${W - pad + 4}" y="${H - (H - 20) * t + 4}" class="ax" text-anchor="start">${AR(Math.round(mx * t))}${o.unit || ''}</text>`).join('')}
  ${data.map((d, i) => { const h = d.v == null ? 0 : (H - 20) * d.v / mx, x = W - pad - (i + 1) * bw + bw * .18; return `<g><rect x="${x}" y="${H - h}" width="${bw * .64}" height="${h}" rx="5" fill="${d.c || 'url(#bg)'}"><title>${esc(d.l)}: ${d.v == null ? NOINFO : d.v}</title></rect><text x="${x + bw * .32}" y="${H - h - 5}" class="bv" text-anchor="middle">${d.v == null ? '—' : AR(d.v)}</text><text x="${x + bw * .32}" y="${H + 18}" class="ax" text-anchor="middle">${esc(String(d.l).slice(0, 12))}</text></g>`; }).join('')}
  <defs><linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#087F69"/><stop offset="1" stop-color="#36B6A2"/></linearGradient></defs></svg>`; }
function line(series, labels, o = {}) { const pts0 = series.flatMap(s => s.v.filter(v => v != null)); if (!pts0.length) return empty(NOINFO); const W = 640, H = 220, pad = 34, mx = o.max || Math.max(1, ...pts0), n = labels.length, x = i => W - pad - (n === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (n - 1)), y = v => H - (H - 20) * v / mx;
  const cols = ['#087F69', '#D4AD60', '#36B6A2', '#C2554D'];
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 44}" role="img" aria-label="${esc(o.label || 'رسم خطي')}">${[0, .5, 1].map(t => `<line x1="${pad}" x2="${W - pad}" y1="${y(mx * t)}" y2="${y(mx * t)}" class="gl"/><text x="${W - pad + 4}" y="${y(mx * t) + 4}" class="ax">${AR(Math.round(mx * t))}${o.unit || ''}</text>`).join('')}
  ${series.map((s, si) => { const p = s.v.map((v, i) => v == null ? null : [x(i), y(v)]); let d = '', pen = false; p.forEach(q => { if (!q) { pen = false; return; } d += (pen ? 'L' : 'M') + q[0] + ' ' + q[1]; pen = true; }); return `<path d="${d}" fill="none" stroke="${cols[si % 4]}" stroke-width="3" stroke-linecap="round"/>${p.map((q, i) => q ? `<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="${cols[si % 4]}"><title>${esc(s.n)} — ${esc(labels[i])}: ${s.v[i]}</title></circle>` : '').join('')}`; }).join('')}
  ${labels.map((l, i) => `<text x="${x(i)}" y="${H + 18}" class="ax" text-anchor="middle">${esc(String(l).slice(0, 10))}</text>`).join('')}${series.length > 1 ? series.map((s, si) => `<rect x="${W - pad - si * 120 - 12}" y="${H + 30}" width="10" height="10" fill="${cols[si % 4]}"/><text x="${W - pad - si * 120 - 16}" y="${H + 39}" class="ax">${esc(s.n)}</text>`).join('') : ''}</svg>`; }
function ring(v, l, o = {}) { const c = 2 * Math.PI * 40, p = v == null ? 0 : Math.max(0, Math.min(100, v)); return `<div class="ring"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(l)}: ${v == null ? NOINFO : v + '٪'}"><circle cx="50" cy="50" r="40" fill="none" class="rbg" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="${o.c || '#087F69'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" transform="rotate(-90 50 50)"/><text x="50" y="${v == null ? 54 : 57}" text-anchor="middle" class="rv" ${v == null ? 'font-size="10"' : ''}>${v == null ? 'لا بيانات' : AR(v) + '٪'}</text></svg><b>${G(l)}</b>${o.sub ? `<small>${G(o.sub)}</small>` : ''}</div>`; }
function tbl(cols, rows, o = {}) { const id = 't' + Math.random().toString(36).slice(2, 7); if (!rows.length) return empty(o.empty || 'لا توجد بيانات بعد.'); return `<div class="tw"><table class="tbl" id="${id}"><thead><tr>${cols.map((c, i) => `<th scope="col"><button class="sortb" data-act="sort" data-t="${id}" data-i="${i}">${G(c)} ⇅</button></th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c == null ? '—' : c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }

function cardImage(title, text, color = '#087F69') {
  const c = document.createElement('canvas'), W = 1080, H = 1350; c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#F1F6F3'); g.addColorStop(1, '#FFFFFF'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = color; x.globalAlpha = .18; x.beginPath(); x.arc(W - 120, 140, 260, 0, 7); x.fill(); x.beginPath(); x.arc(120, H - 120, 220, 0, 7); x.fill(); x.globalAlpha = 1;
  x.fillStyle = '#fff'; x.strokeStyle = '#D4AD60'; x.lineWidth = 4; rr(x, 90, 260, W - 180, H - 520, 40); x.fill(); x.stroke();
  x.direction = 'rtl'; x.textAlign = 'center'; x.fillStyle = '#124C43'; x.font = '700 64px "IBM Plex Sans Arabic", Cairo, sans-serif'; x.fillText(title, W / 2, 380);
  x.font = '500 50px "IBM Plex Sans Arabic", Cairo, sans-serif'; x.fillStyle = '#1F2A27'; wrap(x, text, W / 2, 520, W - 300, 84);
  x.font = '600 38px "IBM Plex Sans Arabic", Cairo, sans-serif'; x.fillStyle = '#087F69'; x.fillText('غرس وأثر · ' + (S.school ? S.school.name : ''), W / 2, H - 140);
  c.toBlob(b => saveBlob('ghars-athar-card.png', b), 'image/png');
}
function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function wrap(x, t, cx, y, mw, lh) { const words = String(t).split(/\s+/); let line = ''; words.forEach(w => { const test = line ? line + ' ' + w : w; if (x.measureText(test).width > mw && line) { x.fillText(line, cx, y); line = w; y += lh; } else line = test; }); if (line) x.fillText(line, cx, y); return y; }

async function logPart(cid, sid, type = 'oral', n = 1) {
  if (!cid || !sid) return; let r = R('participation', x => x.class_id === cid && x.data.date === today())[0];
  const present = presentToday(cid).map(s => s.id);
  if (!r) r = await addRec('participation', {class_id: cid, title: 'مشاركة ' + clsName(cid), data: {date: today(), counts: {}, types: {}, present}});
  const d = JSON.parse(JSON.stringify(r.data)); d.counts[sid] = (d.counts[sid] || 0) + n; d.types[sid] = (d.types[sid] || []).concat(type); d.present = Array.from(new Set((d.present || []).concat(present, [sid])));
  await updRec(r.id, {data: d});
}

ACT.labWheel = () => { const cid = curCls(); TL.cls = cid; const key = cid + today(); TL.used[key] = TL.used[key] || []; const pool = TL.src === 'names' ? presentToday(cid).filter(s => !TL.used[key].includes(s.id)).map(s => ({id: s.id, n: s.name})) : (TL.list.length ? TL.list : ['سؤال 1', 'سؤال 2', 'مهمة']).map((x, i) => ({id: 'q' + i, n: x}));
  const n = Math.max(pool.length, 1), cols = ['#087F69', '#36B6A2', '#D4AD60', '#124C43', '#5DB37E', '#E07A5F'];
  const seg = pool.map((p, i) => { const a0 = i / n * 2 * Math.PI, a1 = (i + 1) / n * 2 * Math.PI, x0 = 150 + 140 * Math.sin(a0), y0 = 150 - 140 * Math.cos(a0), x1 = 150 + 140 * Math.sin(a1), y1 = 150 - 140 * Math.cos(a1), am = (a0 + a1) / 2;
    return `<path d="M150 150L${x0} ${y0}A140 140 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}z" fill="${cols[i % cols.length]}"/><text x="${150 + 92 * Math.sin(am)}" y="${150 - 92 * Math.cos(am)}" transform="rotate(${am * 180 / Math.PI - 90} ${150 + 92 * Math.sin(am)} ${150 - 92 * Math.cos(am)})" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="${n > 20 ? 8 : 12}">${esc(p.n.split(' ').slice(0, 2).join(' ').slice(0, 16))}</text>`; }).join('');
  toolFrame('عجلة الاختيار العادل', `<div class="ctl">${clsPicker(cid)}<div class="seg">${btn('أسماء', 'wSrc', {s: 'names', cls: TL.src === 'names' ? 'on sm' : 'sm'})}${btn('أسئلة/مهام', 'wSrc', {s: 'list', cls: TL.src === 'list' ? 'on sm' : 'sm'})}</div>${btn('جولة جديدة', 'wReset', {cls: 'sm'})}</div>
  ${TL.src === 'list' ? `<textarea class="inp" id="wlist" rows="2" placeholder="سؤال أو مهمة في كل سطر">${esc(TL.list.join('\n'))}</textarea>${btn('تحديث القائمة', 'wList', {cls: 'sm'})}` : `<p class="h">المتبقي في الجولة: ${AR(pool.length)} · الغائبون اليوم مستبعدون تلقائيًا.</p>`}
  <div class="wheel"><div class="ptr">▼</div><svg viewBox="0 0 300 300" id="wsvg" style="transform:rotate(${TL.rot || 0}deg)"><circle cx="150" cy="150" r="146" fill="#fff" stroke="#D4AD60" stroke-width="6"/>${pool.length ? seg : '<text x="150" y="150" text-anchor="middle">انتهت الجولة</text>'}</svg><button class="hub" data-act="wSpin" ${pool.length ? '' : 'disabled'}>لِف</button></div><div id="wres" class="wres" aria-live="polite"></div>`).querySelector('#tool').dataset.re = 'labWheel'; TL.pool = pool; };

ACT.labGum = () => { const cid = curCls(); TL.cls = cid; const src = TL.gsrc || 'names'; const cols = ['#E8A0B4', '#F2C14E', '#36B6A2', '#B8A1E3', '#F08A4B', '#fff', '#087F69'];
  toolFrame('آلة المفاجآت', `<div class="ctl">${clsPicker(cid)}<select data-ch="gSrc" aria-label="محتوى الكبسولات">${Object.entries(GUM_SRC).map(([k, v]) => `<option value="${k}" ${k === src ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="gum"><div class="dome" id="dome">${Array.from({length: 26}, (_, i) => `<i style="--x:${10 + (i * 37) % 80}%;--y:${30 + (i * 53) % 60}%;background:radial-gradient(circle at 30% 30%,#fff,${cols[i % cols.length]})"></i>`).join('')}</div><div class="gbody"><div class="slot"></div><div class="knob" aria-hidden="true"></div></div><div class="gbase"></div></div>
  <div class="btns" style="justify-content:center">${btn('اسحب{ي} كرة', 'gPull', {cls: 'gold'})}</div><div id="gres" aria-live="polite"></div>`).querySelector('#tool').dataset.re = 'labGum'; };
CH.gSrc = el => { TL.gsrc = el.value; };
ACT.gPull = () => { const src = TL.gsrc || 'names', cid = curCls(); let pool;
  if (src === 'names') pool = presentToday(cid).map(s => s.name); else if (src === 'q') pool = R('question').map(q => q.data.text); else if (src === 'value') pool = VALUES().map(v => 'قيمة: ' + v.n + ' — ' + G(v.ch)); else pool = (GUM_DEF[src] || []).map(G);
  if (!pool.length) { toast(src === 'q' ? 'أضف{ي} أسئلة في صندوق الأسئلة' : 'لا عناصر'); return; }
  const d = $('#dome'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); sfx('tick');
  setTimeout(() => { const v = pool[Math.floor(Math.random() * pool.length)]; $('#gres').innerHTML = `<div class="capsule"><span></span><div class="letter"><h3>${esc(v)}</h3>${src === 'names' ? btn('تسجيل مشاركة', 'gLog', {n: v, cls: 'sm pri'}) : ''}</div></div>`; sfx('pop'); confetti(20); }, S.ui.calm ? 50 : 1300); };
ACT.gLog = async el => { const s = stuOf(curCls()).find(x => x.name === el.dataset.n); if (s) { await logPart(curCls(), s.id); toast('سُجلت المشاركة'); } };

/* مؤقت البالونات */
ACT.labBalloon = () => { TL.bt = TL.bt || 120; toolFrame('مؤقت البالونات السحري', `<div class="ctl"><label>الدقائق <input type="number" id="bmin" min="0" max="60" value="${Math.floor(TL.bt / 60)}" class="inp" style="width:80px"></label><label>الثواني <input type="number" id="bsec" min="0" max="59" value="${TL.bt % 60}" class="inp" style="width:80px"></label>${clsPicker(curCls())}<label class="chk"><input type="checkbox" id="bpick"> اختيار ${STU()} عند الانتهاء</label></div>
  <div class="balloons" id="bal">${Array.from({length: 9}, (_, i) => `<span class="bl" style="--x:${8 + i * 10.5}%;--c:${['#E8A0B4', '#F2C14E', '#36B6A2', '#B8A1E3', '#F08A4B', '#7A9CC6', '#5DB37E', '#E07A5F', '#D4AD60'][i]};--d:${(i % 3) * .4}s"></span>`).join('')}<div class="bnum" id="bnum">${AR(Math.floor(TL.bt / 60))}:${AR(String(TL.bt % 60).padStart(2, '0'))}</div></div>
  <div class="btns" style="justify-content:center">${btn('ابدأ', 'bStart', {cls: 'pri', id: 'bgo'})}${btn('إيقاف/استئناف', 'bPause')}${btn('إعادة', 'labBalloon')}</div><div id="bres"></div>`); clearInterval(TL.bi); TL.brun = false; };
ACT.bStart = () => { const tot = (+$('#bmin').value || 0) * 60 + (+$('#bsec').value || 0); if (!tot) return; TL.bt = tot; TL.left = tot; TL.brun = true; clearInterval(TL.bi); TL.bi = setInterval(bTick, 1000); bTick(true); };
ACT.bPause = () => { if (!TL.left) return; TL.brun = !TL.brun; };
function bTick(first) { if (!$('#bal')) { clearInterval(TL.bi); return; } if (!TL.brun) return; if (!first) TL.left--; const p = 1 - TL.left / TL.bt; $('#bal').style.setProperty('--p', p); $('#bnum').textContent = AR(Math.floor(TL.left / 60)) + ':' + AR(String(TL.left % 60).padStart(2, '0')); if (TL.left <= 5 && TL.left > 0) sfx('tick');
  if (TL.left <= 0) { clearInterval(TL.bi); TL.brun = false; $('#bal').classList.add('pop'); confetti(120); sfx('win'); let h = '<div class="letter"><h3>انتهى الوقت! 🎉</h3>'; if ($('#bpick') && $('#bpick').checked) { const pr = presentToday(curCls()); if (pr.length) { const s = pr[Math.floor(Math.random() * pr.length)]; h += `<p>نجم{ة} اللحظة: <b>${esc(s.name)}</b></p>${btn('تسجيل مشاركة', 'gLog', {n: s.name, cls: 'sm pri'})}`; } } $('#bres').innerHTML = h + '</div>'; } }

ACT.snapGo = () => { const sel = $('#snapWho').value, pr = presentToday(curCls()), s = sel ? S.students.find(x => x.id === sel) : pr[Math.floor(Math.random() * pr.length)]; if (!s) { toast('لا ' + STUS()); return; } let n = 3; const cd = $('#cdown');

/* مولد المجموعات */
ACT.labGroups = () => { const cid = curCls(); toolFrame('مولد المجموعات', `<div class="ctl">${clsPicker(cid)}<label>عدد المجموعات <input type="number" id="gn" min="2" max="12" value="${TL.gn || 4}" class="inp" style="width:80px"></label><select id="gmode" aria-label="طريقة التوزيع"><option value="r">توزيع عشوائي</option><option value="m">يدوي (أعدّل بعد التوزيع)</option></select>${btn('وزّع', 'gMake', {cls: 'pri'})}</div><textarea class="inp" id="groles" rows="1" placeholder="المهام (مهمة في كل سطر): قائد، كاتب، مقدّم، مراقب وقت">${esc((TL.roles || ['قائد{ة} المجموعة', 'كاتب{ة}', 'مقدّم{ة}', 'مراقب{ة} الوقت']).map(G).join('\n'))}</textarea><div id="gout" class="groups"></div>`).querySelector('#tool').dataset.re = 'labGroups'; };
ACT.gMake = () => { const n = +$('#gn').value || 4; TL.gn = n; TL.roles = $('#groles').value.split('\n').filter(Boolean); const st = presentToday(curCls()).sort(() => Math.random() - .5), g = Array.from({length: n}, () => []); st.forEach((s, i) => g[i % n].push(s)); TL.groups = g; drawGroups(); };

CH.gMove = el => { const g = TL.groups, from = +el.dataset.g, to = +el.value, i = g[from].findIndex(s => s.id === el.dataset.s); const [s] = g[from].splice(i, 1); g[to].push(s); drawGroups(); };

ACT.gAch = async el => { const m = TL.groups[+el.dataset.g]; busy(true); try { for (const s of m) await addRec('points', {student_id: s.id, class_id: curCls(), title: 'إنجاز فريق', data: {points: 3, reason: 'إنجاز المجموعة ' + (+el.dataset.g + 1), type: 'team', by: myName()}}); for (const s of m) await logPart(curCls(), s.id, 'group'); } finally { busy(false); } confetti(40); toast('سُجل إنجاز الفريق'); };

    `<div class="sl"><h1>فرص التعميم</h1><ul><li>مدارس متعددة بحسابات مستقلة وعزل كامل للبيانات</li><li>بنين وبنات بصياغة تلقائية، وكل المراحل</li><li>استنساخ المبادرات دون بيانات شخصية</li></ul><p class="slog">نغرس قيمة.. نصنع تميزًا.. ونبني أثرًا</p></div>`]; }
let DK = 0;
ACT.deckPlay = () => { DK = 0; const d = document.createElement('div'); d.id = 'stage'; d.className = 'deckfs'; d.innerHTML = `<div class="slide" id="dks"></div><div class="sctl">${btn('السابق', 'dkPrev', {cls: 'sm'})}<span id="dkn"></span>${btn('التالي ←', 'dkNext', {cls: 'sm gold'})}${btn('ملء الشاشة', 'stgFull', {cls: 'sm'})}${btn('خروج', 'stageClose', {cls: 'sm'})}</div>`; document.body.appendChild(d); dkShow(); };
function dkShow() { const s = deckSlides(); $('#dks').innerHTML = s[DK]; $('#dkn').textContent = AR(DK + 1) + ' / ' + AR(s.length); }
ACT.dkNext = () => { if (DK < deckSlides().length - 1) { DK++; dkShow(); } };
ACT.dkPrev = () => { if (DK > 0) { DK--; dkShow(); } };
document.addEventListener('keydown', e => { if (!$('#dks')) return; if (e.key === 'ArrowLeft' || e.key === ' ') ACT.dkNext(); if (e.key === 'ArrowRight') ACT.dkPrev(); });
ACT.deckPdf = () => openDoc(deckSlides().map(s => `<div class="slide pr">${s}</div>`), 'العرض', {land: 1});

const ADM = ['sysadmin', 'principal', 'deputy'];
async function imgData(file, max = 420) { const b = await createImageBitmap(file), k = Math.min(1, max / Math.max(b.width, b.height)), c = document.createElement('canvas'); c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); return c.toDataURL('image/png'); }

/* ===== التحقق من الشهادة ===== */
function vVerify(code) {
  if (!code) return pubShell(card('التحقق من شهادة', `<form data-form="verify">${fld('code', 'رقم الشهادة', 'text', '', {req: 1})}<button class="btn pri">تحقق</button></form>`));
  DB.rpc('ga_verify', {p_code: decodeURIComponent(code)}).then(r => fill(pubShell(r ? card('', `<div class="verok"><div class="vi">✔</div><h1>شهادة صحيحة وصادرة من المنصة</h1><table class="tbl">${[['رقم الشهادة', r.no], ['النوع', r.type], ['الممنوحة له/لها', r.holder], ['السبب', r.reason], ['التاريخ', hij(r.date)], ['الجهة', r.school]].map(x => `<tr><th>${x[0]}</th><td>${esc(x[1] || '—')}</td></tr>`).join('')}</table></div>`) : card('', `<div class="verok bad"><div class="vi">✘</div><h1>لم يُعثر على شهادة بهذا الرقم</h1><p>تأكد من الرقم أو تواصل مع المدرسة.</p></div>`)))).catch(e => fill(pubErr('', e)));
  return '<div class="loading"><div class="spin"></div></div>';
}
FORMS.verify = f => go('verify/' + encodeURIComponent(readForm(f).code.trim().toUpperCase()));

    const it = s.data.items || [];
    fill(pubShell(`<form class="card" data-form="svPub"><h1>${esc(s.title)}</h1><p class="h">${s.data.anon ? 'استبانة مجهولة: لا تُطلب أسماء ولا بيانات شخصية.' : ''} ${s.phase === 'pre' ? '(قياس قبلي)' : '(قياس بعدي)'}</p>
    ${it.map((q, i) => `<fieldset class="f"><legend>${AR(i + 1)}. ${esc(q.q)}</legend>${q.t === 'likert' ? `<div class="lik">${['غير موافق بشدة', 'غير موافق', 'محايد', 'موافق', 'موافق بشدة'].map((l, k) => `<label><input type="radio" name="a${i}" value="${k + 1}"><span>${AR(k + 1)}</span><small>${l}</small></label>`).join('')}</div>`
      : q.t === 'stars' ? `<div class="starsin">${[1, 2, 3, 4, 5].map(k => `<label><input type="radio" name="a${i}" value="${k}"><span aria-label="${k} نجوم">★</span></label>`).join('')}</div>`
      : q.t === 'yn' ? ['نعم', 'لا'].map(o => `<label class="chk"><input type="radio" name="a${i}" value="${o}"> ${o}</label>`).join('')
      : q.t === 'mcq' ? (q.opts || []).map(o => `<label class="chk"><input type="radio" name="a${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')
      : `<textarea class="inp" name="a${i}" rows="3" maxlength="1000"></textarea>`}</fieldset>`).join('')}<button class="btn pri">إرسال</button></form>`, s.school));
  } catch (e) { fill(pubErr('', e)); }
}
FORMS.svPub = async f => { const it = S.pub.s.data.items, ans = it.map((q, i) => { const el = f.querySelector(`[name=a${i}]:checked`) || f.querySelector(`textarea[name=a${i}]`); return el && el.value !== '' ? (['likert', 'stars'].includes(q.t) ? +el.value : el.value.slice(0, 1000)) : null; });

/* ===== شاشة العرض المدرسية ===== */
let DSP_T = null;
async function vDisplay(t) {
  clearInterval(DSP_T);
  try { const d = await DB.rpc('ga_display', {p_token: t}); S.pubG = d.school.gender;
    const att = {}; (d.att || []).forEach(a => { if (a.d !== today() || !a.sum) return; const s = a.sum; const pres = (s.early || 0) + (s.ontime || 0) + (s.late || 0); att[a.c] = pct((s.early || 0) + (s.ontime || 0), pres); });
    const it = d.items || [], mor = it.filter(x => x.kind === 'morning' && x.data.date === today()).pop(), vp = it.filter(x => x.kind === 'value_plan' && (!x.data.from || x.data.from <= today()) && (!x.data.to || x.data.to >= today())).pop();
    const slides = [];
    slides.push(`<div class="dsl"><h2>${G('صباح الأثر')}</h2>${mor ? `<p class="big">${esc(mor.data.text)}</p>` : `<p class="big">نغرس قيمة.. نصنع تميزًا.. ونبني أثرًا</p>`}</div>`);
    if (vp) slides.push(`<div class="dsl"><h2>قيمة الأسبوع</h2><p class="huge">${esc(vp.title)}</p><p>${esc(vp.data.goal || vp.data.msg || '')}</p></div>`);
    if (Object.keys(att).length) slides.push(`<div class="dsl"><h2>الانضباط اليوم</h2><div class="dbars">${Object.entries(att).sort((a, b) => (b[1] || 0) - (a[1] || 0)).map(([c, v]) => `<div><span>${esc(c || '')}</span><i style="width:${v || 0}%"></i><b>${fmtP(v)}</b></div>`).join('')}</div>${d.school.target ? `<p>المستهدف: ${AR(d.school.target)}٪</p>` : ''}</div>`);
    it.filter(x => ['announcement', 'achievement_pub', 'ceremony', 'event'].includes(x.kind)).slice(-6).forEach(x => slides.push(`<div class="dsl"><h2>${{announcement: 'إعلان', achievement_pub: 'إنجاز نفخر به', ceremony: 'تكريم', event: 'فعالية'}[x.kind]}</h2><p class="huge">${esc(x.title)}</p><p>${esc(x.data.text || x.data.desc || (x.data.date ? hij(x.data.date) : ''))}</p></div>`));
    it.filter(x => x.kind === 'challenge').slice(-3).forEach(x => slides.push(`<div class="dsl"><h2>تحدي</h2><p class="huge">${esc(x.title)}</p><p>${esc(x.data.text || '')}</p></div>`));
    let k = 0; const show = () => { const s = $('#dslide'); if (s) { s.innerHTML = slides[k % slides.length]; s.classList.remove('in'); void s.offsetWidth; s.classList.add('in'); $('#dclock').textContent = new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute: '2-digit'}); } k++; };
    fill(`<div class="dsp"><header>${logo(70)}<div><b>${esc(d.school.name)}</b><small>${hij(today())}</small></div><span id="dclock"></span><button class="btn sm" data-act="stgFull">ملء الشاشة</button></header><div id="dslide" class="in"></div><footer>غرس وأثر · ${esc(ATTR)}</footer></div>`);
    show(); DSP_T = setInterval(() => { if (!$('#dslide')) { clearInterval(DSP_T); return; } show(); }, 12000);
  } catch (e) { fill(pubErr('', e)); }
}

  const u = {id: uid(), email: 'demo@ghars.sa', pw: 'demo1234'}; d.users.push(u);

  const day = n => { const t = new Date(); t.setDate(t.getDate() - n); return t.toISOString().slice(0, 10); };
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let n = 14; n >= 0; n--) { const dt = day(n), wd = new Date(dt + 'T12:00').getDay(); if (wd === 5 || wd === 6) continue;
    cls.forEach(c => { const marks = {}, sum = {early: 0, ontime: 0, late: 0, absent: 0, excused: 0}; st.filter(s => s.class_id === c.id).forEach(s => { const x = rnd(), v = x < .05 ? 'absent' : x < (n > 7 ? .2 : .1) ? 'late' : x < .35 ? 'early' : 'ontime'; marks[s.id] = v; sum[v]++; });
